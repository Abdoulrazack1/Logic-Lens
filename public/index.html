<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logic Lens — Analyse Sémantique</title>
<style>
  :root {
    --bg:     #0d1117;
    --bg2:    #161b22;
    --bg3:    #21262d;
    --border: #30363d;
    --text:   #e6edf3;
    --muted:  #7d8590;
    --cyan:   #39d353;
    --blue:   #58a6ff;
    --yellow: #e3b341;
    --red:    #f85149;
    --green:  #3fb950;
    --purple: #bc8cff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; min-height: 100vh; }

  header {
    background: var(--bg2); border-bottom: 1px solid var(--border);
    padding: 14px 24px; display: flex; align-items: center; gap: 12px;
  }
  header h1 { font-size: 15px; font-weight: 600; color: var(--text); letter-spacing: 0.04em; }
  header span { color: var(--muted); font-size: 11px; }
  .badge { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 2px 8px; font-size: 10px; color: var(--cyan); }

  .layout { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 53px); }
  .pane { display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .pane-header { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; }
  .pane-header h2 { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }

  textarea {
    flex: 1; background: var(--bg); color: var(--text); border: none; outline: none;
    padding: 16px; font-family: inherit; font-size: 13px; resize: none; line-height: 1.6;
    tab-size: 2;
  }
  textarea::placeholder { color: var(--muted); }

  .toolbar { background: var(--bg2); border-top: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button {
    background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 6px 14px;
    border-radius: 6px; cursor: pointer; font-family: inherit; font-size: 12px; transition: all .15s;
  }
  button:hover { background: var(--border); border-color: var(--blue); color: var(--blue); }
  button.primary { background: #1f6feb; border-color: #388bfd; color: #fff; font-weight: 600; }
  button.primary:hover { background: #388bfd; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  select { background: var(--bg3); border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 6px; font-family: inherit; font-size: 12px; }

  .output { flex: 1; overflow-y: auto; padding: 16px; }

  /* Report sections */
  .section { margin-bottom: 20px; }
  .section-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted);
    border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .section-title span { color: var(--cyan); }

  .row { display: flex; gap: 8px; margin-bottom: 5px; align-items: flex-start; }
  .label { color: var(--muted); min-width: 120px; flex-shrink: 0; }
  .value { color: var(--text); }

  .fn-row { display: grid; grid-template-columns: 160px 130px 50px 1fr; gap: 8px; padding: 3px 0; border-bottom: 1px solid #1a1f26; align-items: center; }
  .fn-name { color: var(--blue); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fn-role { color: var(--purple); }
  .fn-cx { color: var(--muted); text-align: right; }
  .fn-effects { color: var(--red); font-size: 11px; }

  .intent-row { padding: 4px 0; border-bottom: 1px solid #1a1f26; }
  .intent-fn { color: var(--blue); }
  .intent-text { color: var(--muted); margin-top: 2px; line-height: 1.5; }

  .tag { display: inline-block; background: var(--bg3); border: 1px solid var(--border); border-radius: 3px; padding: 1px 7px; font-size: 11px; margin: 2px; }
  .tag.pattern { border-color: var(--cyan); color: var(--cyan); }
  .tag.arch    { border-color: var(--purple); color: var(--purple); }
  .tag.effect  { border-color: var(--red); color: var(--red); }
  .tag.role    { border-color: var(--blue); color: var(--blue); }

  .score-bar { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .bar-track { flex: 1; height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
  .bar-fill  { height: 100%; border-radius: 3px; transition: width .4s; }
  .bar-label { min-width: 90px; color: var(--muted); }
  .bar-value { min-width: 36px; text-align: right; font-weight: 600; }

  .rec { padding: 5px 8px; margin-bottom: 4px; border-left: 3px solid var(--border); border-radius: 0 4px 4px 0; background: var(--bg2); line-height: 1.5; }
  .rec.haute  { border-color: var(--red); }
  .rec.moyenne{ border-color: var(--yellow); }
  .rec-badge  { font-size: 10px; font-weight: 700; text-transform: uppercase; margin-right: 6px; }
  .rec.haute   .rec-badge { color: var(--red); }
  .rec.moyenne .rec-badge { color: var(--yellow); }

  .flow-chain { color: var(--cyan); font-size: 12px; margin: 3px 0; }
  .arrow { color: var(--muted); }

  .synthesis-box { background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; padding: 12px; margin-bottom: 10px; }
  .synthesis-box h3 { font-size: 11px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  .synthesis-box p  { line-height: 1.6; color: var(--text); }

  .global-score {
    font-size: 28px; font-weight: 700; text-align: center;
    border: 2px solid var(--border); border-radius: 50%; width: 64px; height: 64px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .score-summary { display: flex; align-items: center; gap: 16px; padding: 10px; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; margin-bottom: 12px; }
  .score-summary .detail { flex: 1; }
  .score-summary .detail p { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .score-summary .detail h3 { font-size: 13px; color: var(--text); }

  .empty { color: var(--muted); text-align: center; padding: 40px 20px; line-height: 2; }
  .loading { text-align: center; padding: 40px; color: var(--cyan); }
  .loading::after { content: '…'; animation: dots 1.2s steps(3, end) infinite; }
  @keyframes dots { 0%, 20% { content: '.'; } 40% { content: '..'; } 60%, 100% { content: '…'; } }

  .error-box { background: #1a0f0f; border: 1px solid var(--red); border-radius: 6px; padding: 12px; color: var(--red); }
  .tabs { display: flex; gap: 2px; padding: 8px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); }
  .tab { padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 11px; color: var(--muted); border: 1px solid transparent; }
  .tab.active { background: var(--bg3); border-color: var(--border); color: var(--text); }
  .tab:hover:not(.active) { color: var(--text); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .char-count { font-size: 11px; color: var(--muted); }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .status-dot.ok { background: var(--green); }
  .status-dot.err { background: var(--red); }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div>🔭</div>
  <h1>Logic Lens</h1>
  <span>Analyse sémantique structurelle</span>
  <div class="badge">v1.1</div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-label" style="font-size:11px;color:var(--muted)">…</span>
  </div>
</header>

<div class="layout">
  <!-- LEFT: Editor -->
  <div class="pane">
    <div class="pane-header">
      <h2>Code source JavaScript</h2>
      <span class="char-count" id="char-count">0 car.</span>
    </div>
    <textarea id="editor" placeholder="Collez votre code JavaScript ici…&#10;&#10;Exemples :&#10;  function add(a, b) { return a + b; }&#10;&#10;  const greet = name => `Hello, ${name}!`;" spellcheck="false"></textarea>
    <div class="toolbar">
      <button class="primary" id="analyze-btn" onclick="runAnalysis()">▶ Analyser</button>
      <button onclick="loadExample('simple')">Ex. simple</button>
      <button onclick="loadExample('pipeline')">Ex. pipeline</button>
      <button onclick="loadExample('middleware')">Ex. middleware</button>
      <button onclick="loadExample('class')">Ex. classe</button>
      <div style="margin-left:auto">
        <button onclick="clearEditor()">Effacer</button>
      </div>
    </div>
  </div>

  <!-- RIGHT: Report -->
  <div class="pane" style="border-right:none">
    <div class="tabs" id="tab-bar">
      <div class="tab active" onclick="switchTab('synthese')">Synthèse</div>
      <div class="tab" onclick="switchTab('structure')">Structure</div>
      <div class="tab" onclick="switchTab('semantique')">Sémantique</div>
      <div class="tab" onclick="switchTab('intentions')">Intentions</div>
      <div class="tab" onclick="switchTab('qualite')">Qualité</div>
    </div>
    <div class="output" id="output">
      <div class="empty">
        ← Collez du code JS et cliquez sur <strong>Analyser</strong><br>
        pour obtenir une analyse sémantique complète :<br>
        structure · graphe logique · rôles · intentions · qualité
      </div>
    </div>
  </div>
</div>

<script>
const EXAMPLES = {
  simple: `function euclideanDistance(x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  return Math.sqrt(dx * dx + dy * dy);
}

function clamp(value, min, max) {
  if (value < min) return min;
  if (value > max) return max;
  return value;
}`,

  pipeline: `function parseCSV(raw) {
  return raw.trim().split('\\n').map(line => line.split(','));
}

function normalize(rows) {
  const headers = rows[0];
  return rows.slice(1).map(row =>
    headers.reduce((obj, h, i) => ({ ...obj, [h]: row[i] }), {})
  );
}

function filterEmpty(records) {
  return records.filter(r => Object.values(r).every(v => v && v.trim()));
}

function processCSV(raw) {
  return filterEmpty(normalize(parseCSV(raw)));
}

module.exports = { processCSV };`,

  middleware: `function logger(req, res, next) {
  const start = Date.now();
  console.log(\`[\${new Date().toISOString()}] \${req.method} \${req.url}\`);
  res.on('finish', () => console.log(\`→ \${res.statusCode} (\${Date.now() - start}ms)\`));
  next();
}

function authenticate(req, res, next) {
  const token = req.headers['authorization'];
  if (!token) { res.writeHead(401); res.end('Unauthorized'); return; }
  try { req.user = verifyToken(token); next(); }
  catch (e) { res.writeHead(403); res.end('Forbidden'); }
}

function rateLimiter(windowMs, max) {
  const counts = new Map();
  return function(req, res, next) {
    const ip = req.socket.remoteAddress;
    const now = Date.now();
    const slot = counts.get(ip) || { count: 0, resetAt: now + windowMs };
    if (now > slot.resetAt) { slot.count = 0; slot.resetAt = now + windowMs; }
    if (slot.count >= max) { res.writeHead(429); res.end('Too Many Requests'); return; }
    slot.count++;
    counts.set(ip, slot);
    next();
  };
}`,

  class: `class EventEmitter {
  constructor() {
    this._events = {};
  }

  on(event, listener) {
    if (!this._events[event]) this._events[event] = [];
    this._events[event].push(listener);
    return this;
  }

  off(event, listener) {
    if (!this._events[event]) return this;
    this._events[event] = this._events[event].filter(l => l !== listener);
    return this;
  }

  emit(event, ...args) {
    (this._events[event] || []).forEach(fn => fn(...args));
    return this;
  }

  once(event, listener) {
    const wrapper = (...args) => { listener(...args); this.off(event, wrapper); };
    return this.on(event, wrapper);
  }
}

module.exports = EventEmitter;`
};

let currentTab = 'synthese';
let lastResult = null;

// ─── Status check ─────────────────────────────────────────────────
async function checkStatus() {
  try {
    const r = await fetch('/api/health');
    const data = await r.json();
    document.getElementById('status-dot').className = 'status-dot ok';
    document.getElementById('status-label').textContent = 'API connectée';
  } catch {
    document.getElementById('status-dot').className = 'status-dot err';
    document.getElementById('status-label').textContent = 'API hors ligne';
  }
}
checkStatus();

// ─── Editor ───────────────────────────────────────────────────────
const editor = document.getElementById('editor');
editor.addEventListener('input', () => {
  document.getElementById('char-count').textContent = editor.value.length.toLocaleString('fr') + ' car.';
});
editor.addEventListener('keydown', e => {
  if (e.key === 'Tab') { e.preventDefault(); const s=editor.selectionStart; editor.value=editor.value.slice(0,s)+'  '+editor.value.slice(editor.selectionEnd); editor.selectionStart=editor.selectionEnd=s+2; }
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runAnalysis();
});

function loadExample(name) {
  editor.value = EXAMPLES[name];
  document.getElementById('char-count').textContent = editor.value.length.toLocaleString('fr') + ' car.';
}
function clearEditor() { editor.value = ''; document.getElementById('char-count').textContent = '0 car.'; }

// ─── Analysis ─────────────────────────────────────────────────────
async function runAnalysis() {
  const source = editor.value.trim();
  if (!source) return;
  const btn = document.getElementById('analyze-btn');
  btn.disabled = true;
  btn.textContent = '⏳ Analyse…';
  document.getElementById('output').innerHTML = '<div class="loading">Analyse en cours</div>';

  try {
    const res  = await fetch('/api/semantic', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ source }) });
    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error || data.details || 'Erreur inconnue');
    lastResult = data;
    renderReport(data);
  } catch (err) {
    document.getElementById('output').innerHTML = `<div class="error-box">✗ ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = '▶ Analyser';
  }
}

// ─── Tabs ─────────────────────────────────────────────────────────
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['synthese','structure','semantique','intentions','qualite'][i] === tab);
  });
  if (lastResult) renderReport(lastResult);
}

// ─── Rendering ────────────────────────────────────────────────────
function scoreColor(s) { return s >= 80 ? '#3fb950' : s >= 60 ? '#e3b341' : '#f85149'; }
function barColor(s)   { return s >= 80 ? '#3fb950' : s >= 60 ? '#e3b341' : '#f85149'; }

function renderReport(data) {
  const out = document.getElementById('output');
  const tab = currentTab;

  if (tab === 'synthese')    { out.innerHTML = renderSynthese(data); return; }
  if (tab === 'structure')   { out.innerHTML = renderStructure(data); return; }
  if (tab === 'semantique')  { out.innerHTML = renderSemantique(data); return; }
  if (tab === 'intentions')  { out.innerHTML = renderIntentions(data); return; }
  if (tab === 'qualite')     { out.innerHTML = renderQualite(data); return; }
}

function h(str) { return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderSynthese(data) {
  const syn = data['6_SYNTHESE_FINALE'];
  const qlt = data['5_ANALYSE_QUALITE'];
  const sem = data['3_ANALYSE_SEMANTIQUE'];
  const sc  = parseInt(syn.scoreQualité);

  return `
  <div class="section">
    <div class="score-summary">
      <div class="global-score" style="color:${scoreColor(sc)};border-color:${scoreColor(sc)}">${sc}</div>
      <div class="detail">
        <p>Score de qualité globale</p>
        <h3 style="color:var(--purple)">${h(syn.architectureImplicite)}</h3>
      </div>
    </div>

    <div class="synthesis-box">
      <h3>Comportement réel</h3>
      <p>${h(syn.comportementRéel)}</p>
    </div>

    <div class="synthesis-box">
      <h3>Intention système</h3>
      <p>${h(syn.intentionSystème)}</p>
    </div>

    ${sem.patternsDetectés.length > 0 ? `
    <div class="section-title"><span>Patterns de conception</span></div>
    <div>${sem.patternsDetectés.map(p => `<span class="tag pattern">${h(p)}</span>`).join('')}</div>
    ` : ''}

    ${syn.pointsFaiblesMajeurs.length > 0 ? `
    <div class="section-title" style="margin-top:12px"><span>Points faibles majeurs</span></div>
    ${syn.pointsFaiblesMajeurs.map(w => `<div class="rec haute" style="margin-bottom:5px">${h(w)}</div>`).join('')}
    ` : ''}
  </div>`;
}

function renderStructure(data) {
  const s   = data['1_STRUCTURE'];
  const g   = data['2_GRAPHE_LOGIQUE'];
  const sem = data['3_ANALYSE_SEMANTIQUE'];

  const fnRows = s.functions.map(fn => {
    const role = sem.roles.find(r => r.fn === fn.name);
    const effects = role?.effects || [];
    return `<div class="fn-row">
      <div class="fn-name" title="${h(fn.name)}">${h(fn.name)}</div>
      <div class="fn-role">${h(fn.role)}</div>
      <div class="fn-cx" style="color:${fn.complexity>7?'var(--red)':fn.complexity>4?'var(--yellow)':'var(--muted)'}">${fn.complexity}</div>
      <div class="fn-effects">${effects.map(e=>`<span class="tag effect">${h(e)}</span>`).join('')}${fn.async?'<span class="tag" style="border-color:var(--blue);color:var(--blue)">async</span>':''}</div>
    </div>`;
  }).join('');

  return `
  <div class="section">
    <div class="section-title"><span>Modules</span></div>
    <div class="row"><span class="label">Fonctions</span><span class="value">${s.modules.functions}</span></div>
    <div class="row"><span class="label">Classes</span><span class="value">${s.modules.classes}</span></div>
    <div class="row"><span class="label">Imports</span><span class="value">${s.modules.imports}</span></div>
    <div class="row"><span class="label">Exports</span><span class="value">${s.modules.exports}</span></div>
    ${s.entryPoints.length ? `<div class="row"><span class="label">Points d'entrée</span><span class="value">${s.entryPoints.join(', ')}</span></div>` : ''}
  </div>

  ${s.classes.length ? `
  <div class="section">
    <div class="section-title"><span>Classes</span></div>
    ${s.classes.map(c=>`<div class="row"><span class="label">${h(c.name)}</span><span class="value">${c.parent?`extends ${h(c.parent)} · `:''} ${c.methods} méthode(s)</span></div>`).join('')}
  </div>` : ''}

  <div class="section">
    <div class="section-title"><span>Fonctions &amp; rôles</span>
      <span style="color:var(--muted);font-size:10px">nom · rôle · complexité · effets</span>
    </div>
    <div class="fn-row" style="color:var(--muted);font-size:10px;font-weight:normal">
      <div>Nom</div><div>Rôle</div><div>Cx</div><div>Effets</div>
    </div>
    ${fnRows}
  </div>

  <div class="section">
    <div class="section-title"><span>Graphe logique</span></div>
    <div class="row"><span class="label">Nœuds / arêtes</span><span class="value">${g.metriques.noeuds} / ${g.metriques.arêtes}</span></div>
    <div class="row"><span class="label">Profondeur max</span><span class="value">${g.metriques.profondeurMax}</span></div>
    <div class="row"><span class="label">Complexité moy.</span><span class="value">${g.metriques.complexitéMoyenne}</span></div>
    ${g.composantsCentraux.length ? `<div class="row"><span class="label">Hubs</span><span class="value" style="color:var(--cyan)">${g.composantsCentraux.join(', ')}</span></div>` : ''}
    ${g.fonctionsIsolées.length ? `<div class="row"><span class="label">Isolées</span><span class="value" style="color:var(--muted)">${g.fonctionsIsolées.join(', ')}</span></div>` : ''}
    ${g.fluxCritiques.length ? `
    <div class="section-title" style="margin-top:10px"><span>Flux principaux</span></div>
    ${g.fluxCritiques.map(f => `<div class="flow-chain">${f.split(' → ').map(h).join(' <span class="arrow">→</span> ')}</div>`).join('')}
    ` : ''}
  </div>

  ${s.imports.length ? `
  <div class="section">
    <div class="section-title"><span>Imports (${s.imports.length})</span></div>
    ${s.imports.map(i=>`<div class="row"><span class="label tag">${h(i.kind)}</span><span class="value">${h(i.source)}</span></div>`).join('')}
  </div>` : ''}`;
}

function renderSemantique(data) {
  const sem = data['3_ANALYSE_SEMANTIQUE'];
  const flows = data['2_GRAPHE_LOGIQUE'].fluxCritiques;

  return `
  ${sem.patternsDetectés.length ? `
  <div class="section">
    <div class="section-title"><span>Patterns de conception détectés</span></div>
    ${sem.patternsDetectés.map(p=>`<span class="tag pattern">${h(p)}</span>`).join('')}
  </div>` : ''}

  <div class="section">
    <div class="section-title"><span>Rôles fonctionnels</span></div>
    ${sem.roles.map(r => `
    <div class="intent-row">
      <div><span class="fn-name" style="display:inline">${h(r.fn)}</span>
        <span class="tag role" style="margin-left:8px">${h(r.role)}</span>
        ${(r.effects||[]).map(e=>`<span class="tag effect">${h(e)}</span>`).join('')}
      </div>
      <div class="intent-text">${h(r.description||'')}</div>
      ${r.transforms?.length ? `<div style="margin-top:3px">${r.transforms.map(t=>`<span class="tag" style="font-size:10px">${h(t)}</span>`).join('')}</div>` : ''}
    </div>`).join('')}
  </div>

  ${sem.fluxDeDonnées?.length ? `
  <div class="section">
    <div class="section-title"><span>Flux de données</span></div>
    ${sem.fluxDeDonnées.map(f=>`
    <div class="row">
      <span class="label" style="color:var(--blue)">${h(f.de)}</span>
      <span class="value"><span class="arrow">→</span> <code style="color:var(--yellow)">${h(f.variable)}</code> <span class="arrow">→</span> ${f.vers.map(v=>`<span style="color:var(--cyan)">${h(v)}</span>`).join(', ')}</span>
    </div>`).join('')}
  </div>` : ''}`;
}

function renderIntentions(data) {
  const int = data['4_INTENTIONS'];
  return `
  <div class="section">
    <div class="section-title"><span>Intention globale du système</span></div>
    <div class="synthesis-box"><p>${h(int.globale.narrative)}</p></div>
    ${int.globale.patternsConception?.length ? `<div>${int.globale.patternsConception.map(p=>`<span class="tag pattern">${h(p)}</span>`).join('')}</div>` : ''}
  </div>

  ${int.intermédiaire?.filter(g=>g.groupe.length>=2).length ? `
  <div class="section">
    <div class="section-title"><span>Intentions intermédiaires (groupes)</span></div>
    ${int.intermédiaire.filter(g=>g.groupe.length>=2).map(g=>`
    <div class="intent-row">
      <div>${g.groupe.map(id=>`<span class="tag role">${h(id)}</span>`).join('')}</div>
      <div class="intent-text">${h(g.intention)}</div>
    </div>`).join('')}
  </div>` : ''}

  <div class="section">
    <div class="section-title"><span>Intentions locales</span></div>
    ${int.locale.map(l=>`
    <div class="intent-row">
      <div class="intent-fn">${h(l.fn)} <span class="tag role">${h(l.role)}</span></div>
      <div class="intent-text">${h(l.intention||'')}</div>
    </div>`).join('')}
  </div>`;
}

function renderQualite(data) {
  const q = data['5_ANALYSE_QUALITE'];
  const sc = q.scoreGlobal;

  const barHtml = (label, score, detail='') => `
  <div class="score-bar">
    <span class="bar-label">${label}</span>
    <div class="bar-track"><div class="bar-fill" style="width:${score}%;background:${barColor(score)}"></div></div>
    <span class="bar-value" style="color:${barColor(score)}">${score}</span>
  </div>
  ${detail ? `<div style="font-size:11px;color:var(--muted);margin-bottom:8px;margin-left:120px">${detail}</div>` : ''}`;

  const issuesHtml = (issues) => issues.length ? issues.map(i =>
    `<div class="rec ${i.includes('[HIGH') || i.includes('[HAUTE') ? 'haute' : 'moyenne'}">
      <span class="rec-badge">${i.match(/\[(.*?)\]/)?.[1]||''}</span>${h(i.replace(/^\[.*?\]\s*/,''))}
    </div>`
  ).join('') : '<div style="color:var(--muted);font-size:11px">Aucun problème détecté ✓</div>';

  return `
  <div class="section">
    <div class="section-title"><span>Score global</span><span style="color:${scoreColor(sc)};font-size:18px;font-weight:700">${sc}/100</span></div>
    ${barHtml('Complexité', q.complexité.score)}
    ${barHtml('Couplage', q.couplage.score)}
    ${barHtml('Cohésion', q.cohésion.score)}
    ${barHtml('Dette tech.', q.detteTechnique.score, `Refactoring estimé : ${q.detteTechnique.estimationRefactoring}`)}
  </div>

  ${q.recommandations.length ? `
  <div class="section">
    <div class="section-title"><span>Recommandations</span></div>
    ${q.recommandations.map(r => {
      if (typeof r === 'string') {
        const prio = r.includes('[HAUTE]') ? 'haute' : 'moyenne';
        return `<div class="rec ${prio}"><span class="rec-badge">${r.match(/\[(.*?)\]/)?.[1]||''}</span>${h(r.replace(/^\[.*?\]\s*/,'').replace(/^[^—]+—\s*/,''))}</div>`;
      }
      return `<div class="rec ${r.priority}"><span class="rec-badge">${r.priority}</span><span style="color:var(--muted)">${h(r.scope||'')} — </span>${h(r.action||'')}</div>`;
    }).join('')}
  </div>` : ''}

  <div class="section">
    <div class="section-title"><span>Complexité — détails</span></div>
    ${issuesHtml(q.complexité.problèmes)}
  </div>
  <div class="section">
    <div class="section-title"><span>Couplage — détails</span></div>
    ${issuesHtml(q.couplage.problèmes)}
  </div>
  <div class="section">
    <div class="section-title"><span>Dette technique — détails</span></div>
    ${issuesHtml(q.detteTechnique.items)}
  </div>`;
}

// Init
loadExample('pipeline');
</script>
